# Pan-tilt settings. Edit and re-run - no code changes needed.
# Defaults match the ArduCAM pan-tilt kit (tilt on channel 0, pan on channel 1).

[driver]
i2c_bus = 1              # I2C1 = header pins 3 (SDA) and 5 (SCL)
address = 0x40           # PCA9685 default; confirm with `i2cdetect -y 1`
frequency_hz = 50        # standard servo refresh rate
oscillator_hz = 25000000 # PCA9685 internal clock; tweak only if pulse timing is off

[pan]                    # left / right
channel = 1
min_angle = 0
max_angle = 180
center = 90
min_pulse_us = 500       # pulse width at 0 degrees
max_pulse_us = 2500      # pulse width at 180 degrees
invert = false           # true flips left/right

[tilt]                   # up / down
channel = 0
min_angle = 15           # mechanical limits of the bracket - keep these
max_angle = 145
center = 90
min_pulse_us = 500
max_pulse_us = 2500
invert = false           # true flips up/down

[motion]
speed_dps = 60           # degrees per second for smooth moves
step_deg = 1             # interpolation step
settle_s = 0.3           # wait after a move before capturing (lets vibration die out)

[camera]
rotate_180 = false        # camera is mounted upside down - flips preview and captured photos
preview_width = 1280     # live preview size (find_bounds.py --preview)
preview_height = 720
preview_quality = 70     # JPEG quality of the preview stream, 1-100
preview_port = 8000      # open http://<pi-ip>:8000/ in a browser

[model]                  # Hailo landmark classifier (pantilt live)
hef_path = "models/mars_landmark.hef"  # copy the HEF from mars-landmark-classification here
crop = 1.0               # part of the frame to classify: 1.0 = largest centered square, 0.5 = zoom on crosshair
smooth_frames = 5        # average over N frames so the label doesn't flicker (1 = off)
min_confidence = 0.0     # show "uncertain" below this confidence (0-1)
log_every_s = 1.0        # seconds between rows in the predictions CSV (--log)

[board]                   # the printed map and where the camera sits
distance_mm     = 1500.0  # camera to board surface, measured with a tape
mm_per_px       = 0.0     # `pantilt measure-k` fills this in - survey refuses to run at 0
width_mm        = 1219.0  # the printed map, not the whole sheet
height_mm       = 914.0
overlap         = 0.20    # shared with each neighbour, so a crater on a tile
                          # boundary isn't halved in both tiles
pan_center_deg  = 90.0    # jog to the middle of the board with `pantilt keys`
tilt_center_deg = 90.0    # and read these off
pan_sign        = 1.0     # flip to -1.0 if the scan runs the wrong way
tilt_sign       = 1.0     # with rotate_180 on, expect at least one to be -1.0